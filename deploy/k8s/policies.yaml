apiVersion: v1
kind: Namespace
metadata:
  name: roll-call-demo
  labels: {rollcall.dev/governed: "true"}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rollcall-agent-label
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [deployments]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: labels
      expression: "object.kind == 'Deployment' ? (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}) : (has(object.metadata.labels) ? object.metadata.labels : {})"
  validations:
    - expression: "'rollcall.dev/agent-id' in variables.labels && variables.labels['rollcall.dev/agent-id'] != ''"
      reason: Forbidden
      message: "This agent is not registered with Roll Call: add an AgentRecord with an owner, scopes and evaluation evidence, then label the workload rollcall.dev/agent-id=<id>."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: rollcall-agent-label
spec:
  policyName: rollcall-agent-label
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {rollcall.dev/governed: "true"}
