        labels: { severity: review, slo: unregistered-agents, service: roll-call-control, window: 3d }
        annotations:
          summary: 'No unregistered agents running: burning error budget at over 1x (budget spent exactly at the rate that exhausts it in 30 d).'
          runbook: docs/slo.md
