global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: rollcall-control
    static_configs: [{ targets: ['control:7100'] }]
  - job_name: rollcall-gateway
    static_configs: [{ targets: ['gateway-1:7200', 'gateway-2:7200'] }]
