name: drill regression

# Offline red-teaming: the simulated fault drills and detector set, no hosted model.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: drill-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run drills (does not rewrite impact.json)
        run: node scripts/drill.ts --runs 3 --no-write | tee drill.out
      - name: Gate on precision, recall, containment
        run: |
          head -n -1 drill.out | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const d = r.detector, t = r.drill.timeToContainMs, b = r.drill.budgetsMs;
            const bad = [];
            if (d.precision !== 1) bad.push("precision=" + d.precision);
            if (d.recall !== 1) bad.push("recall=" + d.recall);
            if (t.uncontained !== 0) bad.push("uncontained=" + t.uncontained);
            if (t.p95 > b.containP95) bad.push("containP95=" + t.p95 + " > " + b.containP95);
            if (bad.length) { console.error("FAIL: " + bad.join(", ")); process.exit(1); }
            console.log("ok: precision 1, recall 1, all runs contained, p95 " + t.p95 + " ms");'
